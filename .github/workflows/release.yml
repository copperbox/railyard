# Publish a package to npm with provenance. Wired for releases AFTER the first
# 1.0.0 (which is published locally/manually — see RELEASING.md), because npm
# provenance requires an OIDC publish from CI and cannot be produced locally.
#
# Trigger by pushing a tag like `railyard@1.2.3` or `monitor-github@1.2.3`, or
# run manually and pass the package dir. Auth is npm trusted publishing (OIDC) —
# each package must have this repo + `.github/workflows/release.yml` registered
# as a trusted publisher on npmjs.com. No NPM_TOKEN secret is used.
name: release

on:
  push:
    tags:
      - '*@*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package dir under packages/ (e.g. railyard or railyard-monitor-github)'
        required: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target package dir
        id: target
        run: |
          if [ -n "${{ github.event.inputs.package }}" ]; then
            dir="${{ github.event.inputs.package }}"
          else
            # tag `railyard@x` -> railyard; `monitor-github@x` -> railyard-monitor-github
            name="${GITHUB_REF_NAME%@*}"
            case "$name" in
              railyard) dir="railyard" ;;
              monitor-github|railyard-monitor-github) dir="railyard-monitor-github" ;;
              *) echo "unrecognized tag prefix: $name" >&2; exit 1 ;;
            esac
          fi
          echo "dir=packages/$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pinned to a major: `@latest` silently rolled to npm 12 and broke the
      # release (it changed `npm pack --json` output shape).
      - run: npm install -g npm@12

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test # unit gates; run docker/github gates locally before tagging (RELEASING.md)

      # No NODE_AUTH_TOKEN: auth comes from the OIDC trusted publisher configured
      # on npmjs.com for this repo + workflow file. Provenance is implied, but
      # the flag keeps it explicit.
      - name: Publish with provenance
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --provenance --access public
